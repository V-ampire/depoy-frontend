<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Sensei (dev redirect)</title>
    <script>
      // Dev-редирект: Telegram открывает этот URL, мы пересылаем initData (hash) и query на локальный Vite.
      // Для телефона замените localhost на LAN-IP машины, например http://192.168.1.10:5173
      var DEV_URL = 'http://localhost:5173/'
      location.replace(DEV_URL + location.search + location.hash)
    </script>
  </head>
  <body>Redirecting to local dev server…</body>
</html>
